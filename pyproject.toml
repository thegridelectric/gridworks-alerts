[project]
name = "gridworks-alerts"
version = "0.1.0"
description = "Monitors GridWorks residential heating systems and raises alerts for potential system faults."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "GridWorks", email = "gridworks@gridworks-consulting.com" },
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-auth>=2.0.0",
    "gspread>=6.0.0",
    "pendulum>=3.0.0",
    "psycopg2-binary>=2.9.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.31",
]

[project.scripts]
gwalert = "gwalert.alert_generator:main"
gwalert-sheet = "gwalert.read_sheet:main"

[project.urls]
Homepage = "https://github.com/thegridelectric/gridworks-alerts"
Repository = "https://github.com/thegridelectric/gridworks-alerts"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gwalert"]

[tool.ruff]
src = ["src", "tests"]
exclude = [".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["gwalert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
